# Pushes src/ to the Site Walks Apps Script project and updates the live web app
# (same link) every time something under src/ changes on the main branch.
name: Deploy Site Walks

on:
  push:
    branches: [main]
    paths: ["src/**", ".github/workflows/deploy.yml"]
  workflow_dispatch: {}

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install clasp (Google Apps Script command-line tool)
        run: npm install -g @google/clasp@2.4.2

      - name: Check settings
        env:
          CLASPRC: ${{ secrets.CLASPRC_JSON }}
          SCRIPT_ID: ${{ vars.SCRIPT_ID }}
          DEPLOYMENT_ID: ${{ vars.DEPLOYMENT_ID }}
        run: |
          [ -n "$CLASPRC" ] || { echo "Missing secret CLASPRC_JSON (see README step 6)"; exit 1; }
          [ -n "$SCRIPT_ID" ] || { echo "Missing variable SCRIPT_ID (see README step 7)"; exit 1; }
          [ -n "$DEPLOYMENT_ID" ] || { echo "Missing variable DEPLOYMENT_ID (see README step 7)"; exit 1; }

      - name: Sign in and point at the project
        env:
          CLASPRC: ${{ secrets.CLASPRC_JSON }}
          SCRIPT_ID: ${{ vars.SCRIPT_ID }}
        run: |
          printf '%s' "$CLASPRC" > ~/.clasprc.json
          printf '{"scriptId":"%s","rootDir":"src"}' "$SCRIPT_ID" > .clasp.json

      - name: Upload code
        run: |
          OUT=$(clasp push --force 2>&1); echo "$OUT"
          if echo "$OUT" | grep -qiE "error|not enabled|denied|invalid|could not"; then
            echo "::error title=Upload failed::$(echo "$OUT" | tr '\n' ' ')"; exit 1
          fi
          echo "::notice title=Uploaded::$(echo "$OUT" | grep -c '└─') files"

      - name: Publish new version to the existing web app link
        env:
          DEPLOYMENT_ID: ${{ vars.DEPLOYMENT_ID }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          MSG="$(printf '%s' "${COMMIT_MSG:-manual run}" | head -n1 | cut -c1-80)"
          if OUT=$(clasp deploy --deploymentId "$DEPLOYMENT_ID" --description "Auto ${GITHUB_SHA::7}: $MSG" 2>&1); then
            echo "$OUT"
            echo "::notice title=Published::$(echo "$OUT" | tr '\n' ' ')"
          else
            echo "$OUT"
            echo "::error title=Publish failed::$(echo "$OUT" | tr '\n' ' ')"
            echo "::error title=Deployments in this project::$(clasp deployments 2>&1 | tr '\n' ' ')"
            exit 1
          fi
